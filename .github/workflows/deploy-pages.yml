name: Verify and deploy Dram
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: dram-${{ github.event.pull_request.number || 'pages' }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test tools
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
          python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print("CHROMIUM_PATH="+p.chromium.executable_path); p.stop()' >> "$GITHUB_ENV"
      - name: Test app, durable writes, backups and two tabs
        env:
          DRAM_URL: http://127.0.0.1:4173/whisky/
          DRAM_OFFLINE_IMAGES: '1'
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/dram-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          python scripts/wait-for-app.py
          python tests/quality-e2e.py
          python tests/journal-e2e.py
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    steps:
      - name: Wait for the repository's automatic Pages publication
        uses: actions/github-script@v7
        with:
          script: |
            // This repository also publishes its main branch using legacy Pages.
            // Finish that publication first, so it cannot overwrite the Vite build.
            for (let attempt = 0; attempt < 60; attempt++) {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                ...context.repo,
                per_page: 100
              });
              const pending = data.workflow_runs.filter(run =>
                run.name === 'pages build and deployment' &&
                run.id !== context.runId && run.status !== 'completed'
              );
              if (pending.length === 0) {
                core.info('No automatic Pages publication can overwrite this build.');
                return;
              }
              core.info(`Waiting for automatic Pages runs: ${pending.map(run => run.id).join(', ')}`);
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            throw new Error('Automatic Pages publication did not finish within five minutes.');
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify the public application bundles
        run: node scripts/check-deployment.mjs "${{ steps.deployment.outputs.page_url }}"
