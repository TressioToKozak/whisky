name: Verify and deploy Dram
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Use the built application as the Pages source
        uses: actions/github-script@v7
        with:
          script: |
            const { data: site } = await github.rest.repos.getPages(context.repo);
            if (site.build_type !== 'workflow') {
              await github.request('PUT /repos/{owner}/{repo}/pages', {
                ...context.repo,
                build_type: 'workflow'
              });
            }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify the public application bundles
        run: node scripts/check-deployment.mjs "${{ steps.deployment.outputs.page_url }}"
