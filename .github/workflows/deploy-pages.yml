name: Verify and deploy Dram
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Wait for the repository's automatic Pages publication
        uses: actions/github-script@v7
        with:
          script: |
            // This repository also publishes its main branch using legacy Pages.
            // Finish that publication first, so it cannot overwrite the Vite build.
            for (let attempt = 0; attempt < 60; attempt++) {
              const { data } = await github.rest.actions.listWorkflowRunsForRepo({
                ...context.repo,
                per_page: 100
              });
              const pending = data.workflow_runs.filter(run =>
                run.name === 'pages build and deployment' &&
                run.id !== context.runId && run.status !== 'completed'
              );
              if (pending.length === 0) {
                core.info('No automatic Pages publication can overwrite this build.');
                return;
              }
              core.info(`Waiting for automatic Pages runs: ${pending.map(run => run.id).join(', ')}`);
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            throw new Error('Automatic Pages publication did not finish within five minutes.');
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify the public application bundles
        run: node scripts/check-deployment.mjs "${{ steps.deployment.outputs.page_url }}"
